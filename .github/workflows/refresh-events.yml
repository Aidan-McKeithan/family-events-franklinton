name: Refresh official events

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-official-events
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect official calendars
        run: python scripts/ingest/collect.py
      - name: Validate refreshed data
        run: python scripts/validate_events.py
      - name: Run complete test suite
        run: |
          python -m unittest discover -s tests -v
          node --test tests/logic.test.js
      - name: Open or update a refresh pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "little-day-out-bot"
          git config user.email "actions@users.noreply.github.com"
          REMOTE_SHA=$(git ls-remote --heads origin data/refresh-events | cut -f1)
          git switch -C data/refresh-events
          git add public/data/events.json
          if git diff --cached --quiet; then
            echo "No event changes"
            exit 0
          fi
          git commit -m "data: refresh local events"
          if [ -n "$REMOTE_SHA" ]; then
            git push --force-with-lease=refs/heads/data/refresh-events:$REMOTE_SHA origin HEAD:data/refresh-events
          else
            git push origin HEAD:data/refresh-events
          fi
          OPEN_PR=$(gh pr list --head data/refresh-events --base main --state open --json number --jq '.[0].number')
          if [ -z "$OPEN_PR" ]; then
            gh pr create --base main --head data/refresh-events --title "data: refresh local events" --body "Automated refresh from approved official calendar feeds. Verification must pass before merge."
          else
            echo "Updated open refresh PR #$OPEN_PR"
          fi
